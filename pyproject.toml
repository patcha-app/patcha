[project]
name = "patcha"
version = "0.1.0"
description = "A localised observability for your computer."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0.0",
    "pydantic>=2.5.0",
    "pyobjc-framework-ApplicationServices>=10.0",
    "pyobjc-framework-Cocoa>=10.0",
    "pyobjc-framework-Quartz>=10.0",
    "qdrant-client>=1.7.0",
    "openai>=1.0.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "gitpython>=3.1.0",
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0",
    "numpy>=1.24.0",
    "python-dateutil>=2.8.0",
    "scikit-learn>=1.3.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "psutil>=5.9.0",
    "tiktoken>=0.7.0",
    "mcp>=1.0.0",
    "jinja2>=3.1.0",
]

[project.scripts]
patcha = "patcha.cli:cli"
patcha-mcp = "patcha.mcp_server:main"

[dependency-groups]
dev = [
    "ruff>=0.1.0",
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
    "pytest-cov>=6.0.0",
    "pyinstaller>=6.20.0",
    "pyinstaller-hooks-contrib>=2026.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --ignore=tests/manual"
markers = [
    "unit: pure-function tests with no I/O",
    "integration: tests that use filesystem fixtures or mock subprocesses",
    "slow: tests that take more than 1 second",
    "macos: tests that require macOS-specific APIs",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
